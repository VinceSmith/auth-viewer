<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entra OAuth Explorer</title>
    <link rel="stylesheet" href="/static/style.css?v={{ cache_bust | default('1') }}">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    {% block content %}{% endblock %}
    {# Single source of truth: step fill colours come from diagrams.py via the template context #}
    <script>const STEP_FILLS = {{ step_fills_json }};</script>
    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            sequence: { mirrorActors: false, useMaxWidth: true }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
